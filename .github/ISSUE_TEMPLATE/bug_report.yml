name: "🐛 Bug Report"
description: "File a bug report to help improve Ecosphere"
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report an issue and help improve Ecosphere!

  - type: textarea
    id: description
    attributes:
      label: "Describe the bug"
      description: "A clear and concise description of what the bug is."
      placeholder: "What happened?"
    validations:
      required: true

  - type: textarea
    id: repro-steps
    attributes:
      label: "Steps To Reproduce"
      description: "How can we reproduce this behavior?"
      placeholder: |
        1. Go to '...'
        2. Click on '....'
        3. Scroll down to '....'
        4. See error
    validations:
      required: true

  - type: textarea
    id: expected-behavior
    attributes:
      label: "Expected Behavior"
      description: "What did you expect to happen instead?"
    validations:
      required: true

  - type: dropdown
    id: browser
    attributes:
      label: "Browser / Environment"
      options:
        - "Chrome"
        - "Firefox"
        - "Brave / Chromium"
        - "Safari"
        - "Mobile Browser"
        - "Other"
    validations:
      required: false

  - type: textarea
    id: screenshots
    attributes:
      label: "Screenshots / Logs"
      description: "Drag and drop screenshots, screen recordings, or paste console logs here."
    validations:
      required: false